# docker-compose.yml
# Starts: Kafka + Zookeeper + Schema Registry + Kafka UI + Airflow
#
# HOW TO USE:
#   Start all:     docker-compose up -d
#   Airflow only:  docker-compose up -d postgres airflow-init airflow-webserver airflow-scheduler
#   Stop:          docker-compose down
#   Airflow UI:    http://localhost:8088  (admin / admin)
#   Kafka UI:      http://localhost:8080

version: '3.8'

networks:
  fraud_platform:
    driver: bridge

volumes:
  postgres_data:

x-airflow-common: &airflow-common
  build: .                          # Use our Dockerfile (pre-installs providers + dbt)
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Databricks connection — matches what we stored in Databricks Secrets
    AIRFLOW_CONN_DATABRICKS_DEFAULT: '{"conn_type": "databricks", "host": "https://dbc-228421d6-53f1.cloud.databricks.com", "extra": {"token": "${DATABRICKS_TOKEN}"}}'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt/fraud_platform:/opt/dbt                 # dbt project mounted into Airflow
    - ~/.dbt:/home/airflow/.dbt                     # dbt profiles.yml (has your token)
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - fraud_platform

services:

  # ── ZOOKEEPER ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraud_zookeeper
    networks:
      - fraud_platform
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KAFKA BROKER ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud_kafka
    networks:
      - fraud_platform
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_JMX_PORT: 9101
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── SCHEMA REGISTRY ───────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: fraud_schema_registry
    networks:
      - fraud_platform
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── KAFKA TOPIC INIT ──────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud_kafka_init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: "sleep 15 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.transactions --partitions 3 --replication-factor 1 --config retention.ms=172800000 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.transactions.dead_letter --partitions 1 --replication-factor 1 --config retention.ms=604800000 && echo 'Topics created successfully!' && kafka-topics --bootstrap-server kafka:29092 --list"
    networks:
      - fraud_platform

  # ── KAFKA UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud_kafka_ui
    networks:
      - fraud_platform
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-platform-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ── POSTGRESQL (Airflow metadata database) ────────────────────────────────
  postgres:
    image: postgres:15
    container_name: fraud_postgres
    networks:
      - fraud_platform
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AIRFLOW INIT (runs once to set up DB + create admin user) ────────────
  airflow-init:
    <<: *airflow-common
    container_name: fraud_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Pavan \
          --lastname Kumar \
          --role Admin \
          --email pavankumar.ga14@gmail.com \
          --password admin
        echo "Airflow initialised"

  # ── AIRFLOW WEBSERVER (UI at http://localhost:8088) ───────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: fraud_airflow_webserver
    command: webserver
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ── AIRFLOW SCHEDULER (triggers DAG tasks on schedule) ────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud_airflow_scheduler
    command: scheduler
    restart: always
